<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UF Alumni Legal Finder</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>UF Alumni Legal Finder</h1>
    <p class="subtitle">UF alumni in senior legal roles &mdash; law firm leadership, in-house counsel, and judiciary/government</p>
  </header>

  <main>
    <div class="controls">
      <input id="search" type="text" placeholder="Search name, organization, or title..." />
      <select id="filter-org-type">
        <option value="">All organization types</option>
      </select>
      <select id="filter-practice-area">
        <option value="">All practice areas</option>
      </select>
      <select id="filter-state">
        <option value="">All states</option>
      </select>
      <button id="export-btn">Export CSV</button>
    </div>

    <div id="results-count" class="results-count"></div>
    <div id="results" class="results"></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
